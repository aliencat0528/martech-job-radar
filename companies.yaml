# martech-job-radar 公司主檔
# 這是本專案唯一需要手動維護的檔案。要加公司、改權重，改這裡即可，不用動程式碼。
#
# ── 為什麼這份檔案值錢 ──
# interviewCode 無法自動取得：面試趣的搜尋頁是前端渲染，抓不到公司代碼，
# 每一個都是靠網路搜尋一家家挖出來的。挖到之後永久可用，所以務必保留。
#
# ── 四個維度怎麼來 ──
#   hot     熱門   手動，季更。可查職缺量 ＋ 近 30 天媒體聲量 ＋ 面試趣心得數
#   rep     口碑   自動，由 fetchRep.py 抓面試趣「公司評價」換算，本檔不填
#   growth  成長力 手動，季更。已公開的營收／募資／上市狀態，證據寫在 growthNote
#   open    文化開放 自動，由行為推算（是否用開放平台、是否公開薪資帶、
#                    是否提供實習／遠端、JD 是否具體），本檔不填
#
# rep 換算規則（固定，可重跑）：>=4.0→5、3.5–3.9→4、3.0–3.4→3、2.5–2.9→2、<2.5→1
# 心得數 < 50 視為樣本不足，rep 標「—」不給分，四維總分以已測公司中位數代入（← JR-001）
repScoreBands: [[4.0, 5], [3.5, 4], [3.0, 3], [2.5, 2], [0.0, 1]]
repMinReviews: 50

# 手動來源新鮮度上限（天）。超過就在整併報表要求標為「可能已下架」（← JR-003）
manualMaxAgeDays: 21

# 上游快照：martech-trend-agent 產出的 jobs.json（唯讀契約，← D-018）
# 找不到就降級成只用本專案自抓的來源，不硬相依
trendAgentSnapshotDir: "../martech-trend-agent/data/raw"
trendAgentContractFields: [company, title, area, link, appearDate, source]

